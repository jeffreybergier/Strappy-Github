services:
  altivec-sdk:
    profiles:
      - tools
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    environment:
      ALTIVEC_SDK_ARCHIVE_DIR: /altivec-sdk
    volumes:
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk
    entrypoint: altivec-sdk

  altivec-intelligence:
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    stdin_open: true
    tty: true
    environment:
      - IS_SANDBOX=1
      - TERM=xterm-256color
      - COLORTERM=${COLORTERM:-}
      - ALTIVEC_SDK_ARCHIVE_DIR=/altivec-sdk
    volumes:
      - cache:/cache
      - ${ALTIVEC_SDK_HOST_DIR:-./.altivec-sdk}:/altivec-sdk:ro
      - altivec-sdk-legacy:/osxcross/legacy/target/SDK
      - altivec-sdk-modern:/osxcross/modern/SDK
      - ~/.altivec:/root
      - .:/repo/strappy-git
    working_dir: /repo/strappy-git
    entrypoint: /bin/bash
    command: -lc "altivec-chooser"

  shell:
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    volumes:
      - ~/.strappy:/root
      - .:/repo/strappy-git
    working_dir: /repo/strappy-git

  # Runs the Node.js test suite once and exits with the test result code.
  # Run with: docker compose run --rm test
  test:
    image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    working_dir: /repo/strappy-git
    volumes:
      - ~/.strappy:/root
      - .:/repo/strappy-git
    entrypoint: /bin/bash
    command: -lc "npm install --no-fund --no-audit && npm test"

volumes:
  cache:
  altivec-sdk-legacy:
  altivec-sdk-modern:
